# Deploys the was-ss-cal Worker on push to main.
#
# ─────────────────────────────────────────────────────────────────────────────
# THIS FILE MUST LIVE AT THE REPOSITORY ROOT: .github/workflows/
# GitHub Actions does not look in subfolders. A workflow at
# was-ss-cal/.github/workflows/ is silently ignored — no error, no run.
# ─────────────────────────────────────────────────────────────────────────────
#
# SCOPE: this deploys ONE Worker. The other thirteen in this repo are still
# deployed by hand. That is deliberate — CI is being introduced one Worker at a
# time, starting with the newest and least load-bearing.
#
# To bring another Worker under CI, copy this file, rename it, and change the
# two places its folder name appears: the `paths` filter and `workingDirectory`.
# Do was-cal-engine LAST — every calendar on the site depends on it.
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Cloudflare → My Profile → API Tokens →
#                          "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare → Workers & Pages → right sidebar

name: Deploy was-ss-cal

on:
  push:
    branches: [main]
    # Only run when this Worker's own files change. Without this filter, every
    # commit anywhere in the repo would redeploy it for no reason.
    paths:
      - "was-ss-cal/**"
      - ".github/workflows/deploy-was-ss-cal.yml"
  # Lets you redeploy by hand from the Actions tab without a code change.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy was-ss-cal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler runs inside the Worker's folder so it picks up the right
          # wrangler.toml. Omit this and it deploys nothing, or the wrong thing.
          workingDirectory: "was-ss-cal"
          wranglerVersion: "4"
